<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Песенник — новый адрес</title>
<meta http-equiv="refresh" content="0; url=https://clrussia.github.io/pesennik/">
<link rel="manifest" href="manifest.json">
<style>
  :root{color-scheme: light dark;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
    background:#f4f8f8;color:#2D4A50;
  }
  @media (prefers-color-scheme: dark){
    body{background:#0d2126;color:#e9f3f2;}
    a{color:#5fc3d1;}
  }
  a{color:#3A8E9E;font-weight:700;text-decoration:none;}
  p{max-width:320px;line-height:1.6;font-size:15px;margin:0 0 14px;}
</style>
</head>
<body>
  <div>
    <p>Песенник переехал на новый адрес. Переход должен произойти автоматически.</p>
    <p>Если этого не случилось — <a href="https://clrussia.github.io/pesennik/">откройте новую ссылку</a>.</p>
  </div>
  <script>
    // Снимаем старый service worker и чистим его кэш: этот адрес больше
    // не полноценное приложение, а только редирект-заглушка, держать
    // на нём офлайн-кэш незачем и вредно (может мешать редиректу при
    // плохой сети).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
    location.replace('https://clrussia.github.io/pesennik/');
  </script>
</body>
</html>
